[project]
name = "progresql"
version = "0.1.0"
description = "ProgreSQL: a lightweight workout tracker with auditable exercise settings history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38,<2",
  "streamlit-calendar>=1.3,<2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
  "pyotp>=2.9,<3",
  "qrcode[pil]>=8,<9",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
